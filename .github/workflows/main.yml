name: publish-to-git

on:
  push:
    branches:
      - master
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Check Bash syntax
        run: bash -n entrypoint.sh
      - name: Functional publication and HTTP authentication tests
        run: |
          python3 tests/test_publish.py
          python3 tests/test_authentication.py
      - name: Build the Docker Action
        run: docker build -t publish-artifact-test .
      - name: Functional publication tests through the Docker entrypoint
        env:
          PUBLISH_TEST_IMAGE: publish-artifact-test
        run: python3 tests/test_publish.py
      - name: Prepare a local destination for the actual Action
        run: |
          git init --bare .action-fixture/destination.git
          # Local receive-pack does not inherit environment-based Git config.
          # The runner mounts this temporary HOME into the Action container.
          mkdir -p "$RUNNER_TEMP/_github_home"
          git config --file "$RUNNER_TEMP/_github_home/.gitconfig" --add safe.directory /github/workspace/.action-fixture/destination.git
      - name: Publish with the actual Docker Action and runner outputs
        uses: ./
        id: publish
        env:
          INPUT_REMOTE: file:///github/workspace/.action-fixture/destination.git
        with:
          branch: releases
          github_token: local-fixture-token
          source_folder: .github
          working_directory: .action-fixture/checkout
          no_delete: true
      - name: Repeat unchanged publication with the actual Docker Action
        uses: ./
        id: unchanged
        env:
          INPUT_REMOTE: file:///github/workspace/.action-fixture/destination.git
        with:
          branch: releases
          github_token: local-fixture-token
          source_folder: .github
          working_directory: .action-fixture/unchanged
          no_delete: true
      - name: Verify runner outputs and remote contents
        shell: bash
        env:
          COMMIT_HASH: ${{ steps.publish.outputs.commit_hash }}
          WORKING_DIRECTORY: ${{ steps.publish.outputs.working_directory }}
          UNCHANGED_HASH: ${{ steps.unchanged.outputs.commit_hash }}
          UNCHANGED_DIRECTORY: ${{ steps.unchanged.outputs.working_directory }}
        run: |
          test -n "$COMMIT_HASH"
          test -n "$WORKING_DIRECTORY"
          test -n "$UNCHANGED_DIRECTORY"
          test "$COMMIT_HASH" = "$UNCHANGED_HASH"
          test "$COMMIT_HASH" = "$(git --git-dir=.action-fixture/destination.git rev-parse releases)"
          test "$(git --git-dir=.action-fixture/destination.git rev-list --count releases)" = 1
          git --git-dir=.action-fixture/destination.git show releases:workflows/main.yml > "$RUNNER_TEMP/published-main.yml"
          cmp .github/workflows/main.yml "$RUNNER_TEMP/published-main.yml"

